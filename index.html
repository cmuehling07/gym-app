<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    
    <div id="home" class="screen active">
        <div>
            <div id="homeLogoContainer">
                <img id="liftLogLogoHome" src="assets/icons/LiftLogLogo-500x500-removed.png" alt="LiftLog Logo">
            </div>
            <div id="homeButtonsContainer">
                <button id="navMusclesButton">Muscle Groups</button>
                <button id="startWorkoutButton">Start Workout</button>
            </div>
        </div>
    </div>
    <div id="Muscles" class="screen">
        <div class="header">
            <h1>Muscle Groups</h1> 
        </div>
        <div id="muscleNameButtons"></div>
        <div id="addMuscleGroupButtonContainer"></div>
        <div id="navButtonMuscles" class="navButtons">
        </div>
    </div>
    <div id="startWorkoutScreen" class="screen">
        <div class="header">
            <h1>Build Workout</h1> 
        </div>
        <div id="startWorkoutExercisesContainer">
        </div>
        <div id="startWorkoutAddExercisesButtonContainer">
        </div>
        <div id="navButtonsStartWorkout" class="navButtons">
        </div>
    </div>
    <div id="exerciseListScreen" class="screen">
        <div class="header">
            <h1>Choose an Exercise</h1> 
        </div>
        <div id="exerciseListButtonsContainer">
        </div> 
        <div id="navButtonsExerciseList" class="navButtons">
        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
