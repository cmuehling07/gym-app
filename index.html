<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="home" class="screen active">
        <h1>Gym App</h1>
        <button id="navMusclesButton">Workout Components</button>
        <button id="startWorkoutButton">Start Workout</button>
    </div>
    <div id="Muscles" class="screen">
        <div id="muscleNameButtons"></div>
        <button id="addMuscleGroup">Add</button>
        <div id="navButtonMuscles" class="navButtons">
        </div>
    </div>
    <div id="startWorkoutScreen" class="screen">
        <h1>Build Workout</h1>
        <div id="startWorkoutExercisesContainer">
        </div>
        <div id="startWorkoutAddExercisesButtonContainer">
        <button id="startWorkoutAddExercisesButton">Add Exercises</button>
        </div>
        <button id="startWorkoutCompleteButton">Complete Workout</button>
        <div id="navButtonsStartWorkout" class="navButtons">
        </div>
    </div>
    <div id="exerciseListScreen" class="screen">
        <h1>Choose an Exercise</h1>
    <div id="exerciseListButtonsContainer">
        </div> 
    <div id="navButtonsExerciseList" class="navButtons">
        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
